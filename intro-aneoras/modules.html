let seed=31415;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;

 gr.addColorStop(0,`rgba(${col},1)`);gr.addColorStop(.12,`rgba(${col},.85)`);gr.addColorStop(.3,`rgba(${col},.25)`);gr.addColorStop(1,`rgba(${col},0)`);g.fillStyle=gr;g.fillRect(0,0,128,128);return s;}
const SG=sprite('240,196,115'),SW=sprite('255,248,232'),SR=sprite('147,50,49');
function spr(img,x,y,r,a){if(a<=.004)return;fx.globalAlpha=Math.min(1,a);fx.drawImage(img,x-r,y-r,2*r,2*r);}
const rotY=(v,a)=>[v[0]*Math.cos(a)-v[2]*Math.sin(a),v[1],v[0]*Math.sin(a)+v[2]*Math.cos(a)],rotX=(v,a)=>[v[0],v[1]*Math.cos(a)-v[2]*Math.sin(a),v[1]*Math.sin(a)+v[2]*Math.cos(a)],rotZ=(v,a)=>[v[0]*Math.cos(a)-v[1]*Math.sin(a),v[0]*Math.sin(a)+v[1]*Math.cos(a),v[2]];
const add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],mul=(a,s)=>[a[0]*s,a[1]*s,a[2]*s];

const N=3000;
// ================= stage geometry =================
// S1 FORMALIZE: five stacked layers (documented, structured)
const LAY=[...Array(5)].map((_,l)=>({y:(l-2)*230,s:1150-l*70,r:(l-2)*.06}));
const layPt=(l,u,v)=>{const L=LAY[l];return rotY([(u-.5)*L.s,L.y,(v-.5)*L.s*.72],L.r)};
const layOutline=l=>[[0,0],[1,0],[1,1],[0,1],[0,0]].map(([u,v])=>layPt(l,u,v));

const tilePt=(tr,i,u,v)=>{const f=tileFrame(tr,i);return add(f.c0,add(mul(f.U,(u-.5)*TW),mul(f.V,(v-.5)*TH)))};
// S3 TRAIN DIFFERENTLY: three open pathways + interactive spheres
const pathFn=(k,u)=>{const a=k*2.094+u*Math.PI*1.6;const r=1500-u*700;const y=-650+u*1300+Math.sin(u*Math.PI*3+k)*120;return [Math.cos(a)*r,y,Math.sin(a)*r]};
const SPH=[...Array(7)].map((_,i)=>{const k=i%3,u=.12+i*.12;const p=pathFn(k,u);return {c:add(p,[0,180,0]),r:110+(i%3)*40,k,u}});

const ringPt=(j,u,t)=>{const R=RINGS[j];let p=[Math.cos(u*6.2832)*R.r,0,Math.sin(u*6.2832)*R.r];p=rotZ(rotX(p,R.tx),R.tz);return rotY(p,t*.35*(j%2?-1:1))};

const barV=(i,t)=>{const a=i/NB*Math.PI*2,c0=[Math.cos(a)*BR,-560,Math.sin(a)*BR];const h=barH(i)*barRise(i,t);const U=[Math.cos(a),0,Math.sin(a)],T=[-Math.sin(a),0,Math.cos(a)];
 const o=[];for(const yy of [0,h])for(const [s1,s2] of [[-1,-1],[1,-1],[1,1],[-1,1]])o.push(add(c0,add(add(mul(U,s1*BW/2),mul(T,s2*BW/2)),[0,yy,0])));return o};
// ================= particle targets per stage =================
function S0(){const a=rnd()*6.28,b=Math.acos(rnd()*2-1),r=1200+Math.pow(rnd(),.6)*2600;return {p:[Math.cos(a)*Math.sin(b)*r,Math.cos(b)*r*.6,Math.sin(a)*Math.sin(b)*r]}}
function S1(){const l=Math.floor(rnd()*5),q=rnd();if(q<.35){const n=13;return {p:layPt(l,Math.floor(rnd()*n)/(n-1),Math.floor(rnd()*n)/(n-1))}}
 if(q<.8){const e=layOutline(l),k=Math.floor(rnd()*4);return {p:seg(e[k],e[k+1],rnd())}}
 if(q<.92){const v=rnd(),row=Math.floor(rnd()*4);return {p:layPt(l,.12+v*(.5+((row*37)%5)*.08),.2+row*.17)}}

function S2(){const q=rnd();if(q<.82){const tr=Math.floor(rnd()*3),i=Math.floor(rnd()*6),w=rnd();
  if(w<.6){const e=[[0,0],[1,0],[1,1],[0,1],[0,0]],k=Math.floor(rnd()*4),u=rnd();return {p:tilePt(tr,i,lerp(e[k][0],e[k+1][0],u),lerp(e[k][1],e[k+1][1],u))}}
  if(w<.8){const row=Math.floor(rnd()*3);return {p:tilePt(tr,i,.1+rnd()*.45,.25+row*.22)}}
  const a=rnd()*6.28;return {p:tilePt(tr,i,.75+Math.cos(a)*.13,.5+Math.sin(a)*.22)}}

 const s=SPH[Math.floor(rnd()*SPH.length)];const a=rnd()*6.28,b=Math.acos(rnd()*2-1);return {p:add(s.c,[Math.cos(a)*Math.sin(b)*s.r,Math.cos(b)*s.r,Math.sin(a)*Math.sin(b)*s.r]),sph:s}}
function S4(){const q=rnd();if(q<.84){return {ring:Math.floor(rnd()*3),u:rnd()}}const j=Math.floor(rnd()*3),u=Math.floor(rnd()*6)/6;return {spoke:j,u,v:rnd()}}

 case 3:{if(T.sph){const b=Math.sin(t*1.6+T.sph.u*9)*40;return add(T.p,[0,b,0])}return T.p}

 fx.globalAlpha=1;for(const [ww,aa,cc] of [[gw,.2,C[0]],[w,.92,C[1]]]){fx.strokeStyle=`rgba(${cc},${aa*a})`;fx.lineWidth=ww;fx.beginPath();Q.forEach((q,i)=>i?fx.lineTo(q[0],q[1]):fx.moveTo(q[0],q[1]));fx.stroke();}return Q[Q.length-1];}

 // ---------- stage lines ----------

 {const v=vis(t,3.4,5.2,6.8,8.6);if(v>0){for(let l=0;l<5;l++){line3(layOutline(l),sm(t,3.4+l*.18,4.9+l*.18),'g',v*.95);

    for(let r=0;r<3;r++)line3([tilePt(tr2,i,.1,.25+r*.22),tilePt(tr2,i,.1+.18+((r+i)%3)*.1,.25+r*.22)],pd,'g',v*.6,1.6,6);
    const f=tileFrame(tr2,i);line3([...Array(25)].map((_,k)=>{const a=k/24*6.2832;return tilePt(tr2,i,.75+Math.cos(a)*.13,.5+Math.sin(a)*.22)}),pd,'g',v*.7,1.6,6);

 // S3 learning environment
 {const v=vis(t,13.4,15.2,18.4,20.4);if(v>0){for(let k=0;k<3;k++){const pts=[...Array(121)].map((_,i)=>pathFn(k,i/120));line3(pts,sm(t,13.4+k*.3,15.6+k*.3),'g',v,2.8,13);

 {const v=vis(t,19.4,21,24.4,26.4);if(v>0){for(let j=0;j<3;j++){line3([...Array(121)].map((_,i)=>ringPt(j,i/120,t)),sm(t,19.4+j*.25,21+j*.25),j===1?'w':'g',v,2.6,12);
