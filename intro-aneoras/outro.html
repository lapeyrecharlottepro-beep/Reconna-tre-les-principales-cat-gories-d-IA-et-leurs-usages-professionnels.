<!doctype html><html><head><meta charset="utf-8"><title>ANEORAS outro</title>
<style>
@font-face{font-family:'Montserrat';font-weight:300;src:url(fonts/montserrat-latin-300-normal.woff2) format('woff2')}
@font-face{font-family:'Montserrat';font-weight:500;src:url(fonts/montserrat-latin-500-normal.woff2) format('woff2')}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#05254E}
.l{position:absolute;inset:0}
#logo{position:absolute;left:50%;top:470px;width:1300px;transform:translate(-50%,-50%)}
#logo img{width:100%;display:block}
#shine{position:absolute;inset:0;-webkit-mask:url(logo_rgba.png) center/100% 100% no-repeat;background:linear-gradient(105deg,transparent 42%,rgba(255,244,215,.85) 50%,transparent 58%);background-size:300% 100%;mix-blend-mode:screen}
#tag{position:absolute;left:0;right:0;top:672px;display:flex;justify-content:center;align-items:center;gap:34px;font-family:Montserrat;font-weight:300;font-size:40px;letter-spacing:.14em;color:#fff}
#tag .ln{width:90px;height:1.5px;background:linear-gradient(90deg,rgba(214,161,59,0),#D6A13B)}
#tag .ln.r{background:linear-gradient(90deg,#D6A13B,rgba(214,161,59,0))}
#tag b{font-weight:500;color:#E2B65C}
</style></head><body>
<canvas id="c" class="l" width="3840" height="2160" style="width:1920px;height:1080px"></canvas>
<div id="glow" class="l" style="background:radial-gradient(ellipse 900px 330px at 50% 470px,rgba(214,161,59,.32),rgba(214,161,59,0) 70%);opacity:0"></div>
<div id="logo"><img src="logo_rgba.png"><div id="shine"></div></div>
<div id="tag"><span class="ln"></span><span id="tt">Votre potentiel<b>.</b> Notre stratégie<b>.</b></span><span class="ln r"></span></div>
<canvas id="fx" class="l" width="3840" height="2160" style="width:1920px;height:1080px;mix-blend-mode:screen"></canvas>
<div id="blk" class="l" style="background:#000"></div>
<script>
const W=3840,H=2160,cx=W/2,cy=H/2;
const c=document.getElementById('c').getContext('2d'),fx=document.getElementById('fx').getContext('2d');
const $=id=>document.getElementById(id);
let seed=11;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const parts=[...Array(240)].map(()=>({x:(rnd()-.5)*W*1.3,y:(rnd()-.5)*H*1.3,z:.35+rnd()*.9,s:rnd(),ph:rnd()*6.28,vx:(rnd()-.5)*30,vy:-8-rnd()*22,g:rnd()}));
const cl=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const sm=(t,a,b)=>{const k=cl((t-a)/(b-a));return k*k*(3-2*k)};
const eio=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
function star(g,x,y,r,a,rays=1){if(a<=0||r<=0)return;g.save();g.globalAlpha=a;
 let gr=g.createRadialGradient(x,y,0,x,y,r*7);gr.addColorStop(0,'rgba(255,238,200,.5)');gr.addColorStop(.3,'rgba(226,182,92,.16)');gr.addColorStop(1,'rgba(214,161,59,0)');
 g.fillStyle=gr;g.beginPath();g.arc(x,y,r*7,0,7);g.fill();
 for(const [len,th,rot] of [[r*5.5*rays,r*.07,0],[r*3.6*rays,r*.06,Math.PI/2],[r*1.8*rays,r*.04,Math.PI/4],[r*1.8*rays,r*.04,-Math.PI/4]]){
  g.save();g.translate(x,y);g.rotate(rot);const lg=g.createLinearGradient(-len,0,len,0);
  lg.addColorStop(0,'rgba(255,215,140,0)');lg.addColorStop(.5,'rgba(255,246,222,.9)');lg.addColorStop(1,'rgba(255,215,140,0)');
  g.fillStyle=lg;g.beginPath();g.ellipse(0,0,len,Math.max(th,1.2),0,0,7);g.fill();g.restore();}
 gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,'#fffdf7');gr.addColorStop(.45,'rgba(255,236,185,.92)');gr.addColorStop(1,'rgba(255,205,110,0)');
 g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,7);g.fill();g.restore();}
// light trail: cubic bezier from star sweeping down-left (echo of the logo swoosh)
const B=[[0,0],[-620,-60],[-1250,420],[-2350,1320]];
const bez=k=>{const u=1-k;return [0,1].map(i=>u*u*u*B[0][i]+3*u*u*k*B[1][i]+3*u*k*k*B[2][i]+k*k*k*B[3][i])};
// logo star position (CSS px -> canvas px)
const LW=1300,LH=LW*646/3162,LSX=(960-LW/2+LW*.1847)*2,LSY=(470-LH/2+LH*.186)*2;
window.DURATION=10;
window.seek=t=>{
 c.clearRect(0,0,W,H);fx.clearRect(0,0,W,H);
 // background: deep navy, almost black at the edges, warmer depth at centre
 const glowAmt=.5+.5*sm(t,1,4);
 c.fillStyle='#020c1c';c.fillRect(0,0,W,H);
 let bg=c.createRadialGradient(cx,cy,0,cx,cy,W*.62);bg.addColorStop(0,`rgba(12,48,96,${.85*glowAmt})`);bg.addColorStop(.55,'rgba(5,37,78,.55)');bg.addColorStop(1,'rgba(2,12,28,0)');
 c.fillStyle=bg;c.fillRect(0,0,W,H);
 const navyA=sm(t,6.2,8.2);if(navyA>0){c.globalAlpha=navyA;c.fillStyle='#05254E';c.fillRect(0,0,W,H);c.globalAlpha=1;}
 // dolly-in scale
 const dz=1+.16*eio(cl(t/6.5));
 // particles: drift, converge (4-5s), disperse with the wave (5-6.2s)
 const f=t<4?0:t<5?.82*eio(t-4):t<6.4?.82-1.12*eio((t-5)/1.4):-.3;
 const pa=sm(t,.2,1.6)*(1-.7*sm(t,6.2,8));
 for(const p of parts){let x=p.x+p.vx*t+Math.sin(t*.6+p.ph)*20,y=p.y+p.vy*t;
  x*=dz*(1+(p.z-.8)*(dz-1)*2);y*=dz*(1+(p.z-.8)*(dz-1)*2);
  x=x*(1-f);y=y*(1-f);const px=cx+x,py=cy+y;
  const r=(2+p.s*7)*p.z*(f>0?1-f*.5:1);const tw=.6+.4*Math.sin(t*1.7+p.ph);
  const a=pa*(.25+.55*p.s)*tw;if(a<=.01)continue;
  const gr=c.createRadialGradient(px,py,0,px,py,r*3);const col=p.g>.55?'255,226,165':'225,235,255';
  gr.addColorStop(0,`rgba(${col},${a})`);gr.addColorStop(.35,`rgba(${col},${a*.45})`);gr.addColorStop(1,`rgba(${col},0)`);
  c.fillStyle=gr;c.beginPath();c.arc(px,py,r*3,0,7);c.fill();}
 // star: intensifies, pulses, then glides into the logo's star
 const pulse=Math.exp(-Math.pow((t-4.7)/.28,2));
 const mv=eio(cl((t-5.2)/1.3));
 const sx=cx+(LSX-cx)*mv,sy=cy+(LSY-cy)*mv;
 const sr=(16+34*sm(t,.8,4.2))*(1+.55*pulse)*(1-.75*mv)*(1+.04*Math.sin(t*7));
 star(fx,sx,sy,sr,sm(t,0,1)*(1-sm(t,6.2,6.9)),1+.4*sm(t,1.5,4));
 // golden trail
 const tr=eio(cl((t-1.6)/2.6)),ta=sm(t,1.6,2)*(1-sm(t,4.8,6))*.9;
 if(ta>0&&tr>0){const n=140;fx.save();fx.translate(cx,cy);fx.scale(dz,dz);fx.lineCap='round';
  for(let i=0;i<n;i++){const k0=i/n*tr,k1=(i+1)/n*tr;if(k1>tr)break;const [x0,y0]=bez(k0),[x1,y1]=bez(k1);
   const w=(1-k0/1.1)*10+1.5;const head=Math.exp(-Math.pow((k0-tr)/.05,2));
   for(const [mul,al] of [[6,.06],[2.4,.22],[1,.9]]){fx.strokeStyle=`rgba(${head>.3?'255,240,205':'226,178,86'},${al*ta*(.35+.65*(k0/Math.max(tr,.01)))})`;fx.lineWidth=w*mul;fx.beginPath();fx.moveTo(x0,y0);fx.lineTo(x1,y1);fx.stroke();}}
  const [hx,hy]=bez(tr);fx.restore();star(fx,cx+hx*dz,cy+hy*dz,10,ta*(1-sm(t,3.8,4.3)),.6);}
 // light wave
 const wk=cl((t-4.85)/1.4);if(wk>0&&wk<1){const R=200+wk*2600,al=.10*(1-wk);
  const gr=fx.createRadialGradient(cx,cy,R*.45,cx,cy,R);gr.addColorStop(0,'rgba(255,230,170,0)');gr.addColorStop(.6,`rgba(255,232,180,${al})`);gr.addColorStop(1,'rgba(255,232,180,0)');
  fx.fillStyle=gr;fx.fillRect(0,0,W,H);}
 // logo emerges from darkness, lit by the golden light
 const la=sm(t,5.2,6.8);
 $('logo').style.opacity=la.toFixed(3);
 $('logo').style.filter=`blur(${(1-sm(t,5.2,6.6))*10}px) brightness(${(.6+.4*la).toFixed(3)})`;
 $('glow').style.opacity=(sm(t,5,6.2)*(1-.75*sm(t,6.8,8.4))).toFixed(3);
 const shk=cl((t-6.5)/1.4);$('shine').style.backgroundPosition=`${100-shk*100}% 0`;$('shine').style.opacity=(shk>0&&shk<1)?1:0;
 const sp=Math.sin(Math.PI*cl((t-6.6)/1.2));star(fx,LSX,LSY,8+sp*14,sp*.85,.9);
 // tagline
 const ga=sm(t,7.2,8.3);$('tag').style.opacity=ga.toFixed(3);$('tag').style.transform=`translateY(${(1-ga)*14}px)`;
 $('tt').style.letterSpacing=(0.14+0.1*(1-ga)).toFixed(3)+'em';
 $('blk').style.opacity=(1-sm(t,0,.9)).toFixed(3);
};
window.ready=Promise.all([new Promise(r=>{const i=document.querySelector('#logo img');i.complete?r():i.onload=r}),document.fonts.load('300 40px Montserrat'),document.fonts.load('500 40px Montserrat')]).then(()=>{seek(0);return true});
</script></body></html>
