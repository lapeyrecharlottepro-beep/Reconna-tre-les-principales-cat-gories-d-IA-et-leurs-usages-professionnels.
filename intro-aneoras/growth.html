<!doctype html><html><head><meta charset="utf-8"><title>ANEORAS SME growth</title>
<style>*{margin:0;padding:0}html,body{width:1920px;height:1080px;overflow:hidden;background:#000}canvas{position:absolute;inset:0;width:1920px;height:1080px}</style></head><body>
<canvas id="bg" width="3840" height="2160"></canvas><canvas id="c" width="3840" height="2160"></canvas><canvas id="fx" width="3840" height="2160" style="mix-blend-mode:screen"></canvas>
<script>
const W=3840,H=2160,cx=W/2,cy=H/2,F=2300,DUR=16;
const bgc=document.getElementById('bg').getContext('2d'),c=document.getElementById('c').getContext('2d'),fx=document.getElementById('fx').getContext('2d');
let seed=2024;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const cl=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)),sm=(t,a,b)=>{const k=cl((t-a)/(b-a));return k*k*(3-2*k)},lerp=(a,b,k)=>a+(b-a)*k;
const eio=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
function sprite(col){const s=document.createElement('canvas');s.width=s.height=128;const g=s.getContext('2d');const gr=g.createRadialGradient(64,64,0,64,64,64);
 gr.addColorStop(0,`rgba(${col},1)`);gr.addColorStop(.12,`rgba(${col},.85)`);gr.addColorStop(.3,`rgba(${col},.25)`);gr.addColorStop(1,`rgba(${col},0)`);g.fillStyle=gr;g.fillRect(0,0,128,128);return s;}
const SG=sprite('240,196,115'),SW=sprite('255,248,232'),SR=sprite('147,50,49');
function spr(img,x,y,r,a){if(a<=.004)return;fx.globalAlpha=Math.min(1,a);fx.drawImage(img,x-r,y-r,2*r,2*r);}
const seg=(a,b,u)=>[lerp(a[0],b[0],u),lerp(a[1],b[1],u),lerp(a[2],b[2],u)];
// ---------- architecture on an organised grid, growing in square rings ----------
const CELL=300,FOOT=235,RT=[[1.4,4.2],[4.2,7],[6.4,9.4],[8.6,11.6]];
const cells=[];
for(let i=-4;i<4;i++)for(let j=-4;j<4;j++){const x=(i+.5)*CELL,z=(j+.5)*CELL;const ring=Math.max(Math.abs(i+.5),Math.abs(j+.5))-.5;
 if(ring===3&&(rnd()<.18||(Math.abs(i+.5)===3.5&&Math.abs(j+.5)===3.5)))continue;
 const base=[640,560,400,250][ring],var_=(rnd()-.5)*110;const t0=ring===0?0:RT[ring][0]+((Math.atan2(z,x)+Math.PI)/6.283)*1.4+rnd()*.3;
 cells.push({i,j,x,z,ring,h:ring===0?base:base+var_,t0,red:ring>0&&rnd()<.18,gold:ring===0||(ring===1&&rnd()<.25),ph:rnd()});}
const core=cells.filter(c=>c.ring===0);
function hOf(cl_,t){if(cl_.ring===0)return lerp(260+cl_.h*.0+cl_.ph*60,1180+cl_.ph*120,eio(sm(t,9,13)));return cl_.h*eio(sm(t,cl_.t0,cl_.t0+2))}
const EDG=[[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]];
const FACES=[[[0,1,5,4],[0,0,-1]],[[1,2,6,5],[1,0,0]],[[2,3,7,6],[0,0,1]],[[3,0,4,7],[-1,0,0]],[[4,5,6,7],[0,1,0]]];
const bV=(x,z,h,w=FOOT)=>{const o=[];for(const y of [0,h])for(const [a,b] of [[-1,-1],[1,-1],[1,1],[-1,1]])o.push([x+a*w/2,y,z+b*w/2]);return o};
// bridges between neighbouring cells (processes connecting teams)
const bridges=[];for(const a of cells)for(const b of cells){if(a===b)continue;if((b.i===a.i+1&&b.j===a.j)||(b.j===a.j+1&&b.i===a.i))if(rnd()<.55||a.ring===0||b.ring===0)bridges.push({a,b,ph:rnd(),y:.55+rnd()*.3});}
// ---------- camera: forward and slightly upward ----------
let CAM;
function lookAt(p,tg){let f=[tg[0]-p[0],tg[1]-p[1],tg[2]-p[2]];let n=Math.hypot(...f);f=f.map(v=>v/n);let r=[f[2],0,-f[0]];n=Math.hypot(...r);r=r.map(v=>v/n);
 const u=[r[1]*f[2]-r[2]*f[1],r[2]*f[0]-r[0]*f[2],r[0]*f[1]-r[1]*f[0]];CAM={p,f,r,u};}
function setCam(t){const k=t/DUR*.55+sm(t,0,DUR)*.45;const az=Math.PI/2+.62-.18*k,dist=lerp(3500,2950,k),y=lerp(560,1750,k);
 lookAt([Math.cos(az)*dist,y,Math.sin(az)*dist],[0,lerp(260,520,k),0]);}
function tr(q){const d=[q[0]-CAM.p[0],q[1]-CAM.p[1],q[2]-CAM.p[2]];return [d[0]*CAM.r[0]+d[1]*CAM.r[1]+d[2]*CAM.r[2],d[0]*CAM.u[0]+d[1]*CAM.u[1]+d[2]*CAM.u[2],d[0]*CAM.f[0]+d[1]*CAM.f[1]+d[2]*CAM.f[2]];}
const pr=q=>[cx-q[0]*F/q[2],cy+q[1]*F/q[2]];const P=v=>pr(tr(v));
function poly(g,pts){g.beginPath();g.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)g.lineTo(pts[i][0],pts[i][1]);g.closePath();}
function line(g,a,b,col,al,w){g.strokeStyle=`rgba(${col},${al})`;g.lineWidth=w;g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.stroke();}
const dust=[...Array(420)].map(()=>({p:[(rnd()-.5)*9000,rnd()*4500-300,(rnd()-.5)*9000],s:rnd(),ph:rnd()*6.28}));
window.DURATION=DUR;
window.seek=t=>{setCam(t);const fade=sm(t,0,1);
 bgc.fillStyle='#050b14';bgc.fillRect(0,0,W,H);
 const C0=P([0,300,0]);let g=bgc.createRadialGradient(C0[0],C0[1],0,C0[0],C0[1],W*.7);g.addColorStop(0,`rgba(${30+14*sm(t,2,10)|0},${53+12*sm(t,2,10)|0},${77+6*sm(t,2,10)|0},${fade})`);g.addColorStop(.6,'rgba(16,30,48,1)');g.addColorStop(1,'rgba(5,11,20,1)');bgc.fillStyle=g;bgc.fillRect(0,0,W,H);
 c.clearRect(0,0,W,H);fx.clearRect(0,0,W,H);fx.globalCompositeOperation='lighter';fx.lineCap=fx.lineJoin='round';
 for(const d of dust){const q=tr(d.p);if(q[2]<200)continue;const Q=pr(q);spr(SG,Q[0],Q[1],Math.max(2,F/q[2]*12),.17*fade*(.5+.5*Math.sin(t*.8+d.ph)));}
 // foundation: polar/grid ground lines spreading with the growth, gold wave front
 const gr_=lerp(420,1500,eio(sm(t,3.6,12)));
 for(let k=-5;k<=5;k++)for(const dir of [0,1]){const a=k*CELL;const L=Math.sqrt(Math.max(0,gr_*gr_-a*a));if(L<=0)continue;const p0=dir?[a,0,-L]:[-L,0,a],p1=dir?[a,0,L]:[L,0,a];
  const N=12;for(let s=0;s<N;s++){const A=P(seg(p0,p1,s/N)),B=P(seg(p0,p1,(s+1)/N));line(bgc,A,B,'214,161,59',.13*fade,1.6);}}
 {const pts=[...Array(97)].map((_,i)=>{const a=i/96*6.283;return P([Math.cos(a)*gr_,2,Math.sin(a)*gr_])});fx.globalAlpha=1;fx.strokeStyle=`rgba(236,196,120,${.55*sm(t,3.6,5)})`;fx.lineWidth=3;fx.beginPath();pts.forEach((q,i)=>i?fx.lineTo(...q):fx.moveTo(...q));fx.stroke();}
 {const rr=980;const pts=[...Array(97)].map((_,i)=>{const a=i/96*6.283;return P([Math.cos(a)*rr,3,Math.sin(a)*rr])});fx.strokeStyle=`rgba(147,50,49,${.6*sm(t,7.5,9.5)})`;fx.lineWidth=2.4;fx.beginPath();pts.forEach((q,i)=>i?fx.lineTo(...q):fx.moveTo(...q));fx.stroke();}
 // golden light entering from above
 const beam=sm(t,1.4,2.6)*(1-.65*sm(t,5,8));
 if(beam>0){const top=P([0,4200,0]),bot=P([0,hOf(core[0],t)+40,0]);const w=F/tr([0,600,0])[2]*170;
  for(const [ww,a] of [[w*2.4,.10],[w,.25],[w*.25,.6]]){const lg=fx.createLinearGradient(top[0],top[1],bot[0],bot[1]);lg.addColorStop(0,'rgba(255,225,160,0)');lg.addColorStop(1,`rgba(255,236,190,${a*beam})`);fx.strokeStyle=lg;fx.lineWidth=ww;fx.globalAlpha=1;fx.beginPath();fx.moveTo(...top);fx.lineTo(...bot);fx.stroke();}
  spr(SG,bot[0],bot[1],F/tr([0,600,0])[2]*900,.5*beam);spr(SW,bot[0],bot[1],F/tr([0,600,0])[2]*120,.8*beam);}
 // ---- blocks (painter's order)
 const lit=t=>sm(t,1.8,4);
 const L=cells.map(cl_=>{const h=hOf(cl_,t);return {cl_,h,d:tr([cl_.x,h/2,cl_.z])[2]}}).filter(o=>o.h>2&&o.d>100).sort((a,b)=>b.d-a.d);
 const camP=CAM.p;
 for(const {cl_,h,d} of L){const V=bV(cl_.x,cl_.z,h),T=V.map(tr);if(T.some(q=>q[2]<60))continue;const Pp=T.map(pr);const fog=cl(1-(d-4000)/9000)*fade;
  const goldK=cl_.gold?sm(t,cl_.ring===0?3:cl_.t0+1.2,cl_.ring===0?5.5:cl_.t0+2.6):0;
  const vis=new Set();
  for(const [ix,n] of FACES){const ctr=ix.map(k=>V[k]).reduce((s,p)=>[s[0]+p[0]/4,s[1]+p[1]/4,s[2]+p[2]/4],[0,0,0]);if((camP[0]-ctr[0])*n[0]+(camP[1]-ctr[1])*n[1]+(camP[2]-ctr[2])*n[2]<=0)continue;
   for(let q=0;q<4;q++){const a=ix[q],b=ix[(q+1)%4];vis.add(Math.min(a,b)+'_'+Math.max(a,b))}
   const pts=ix.map(k=>Pp[k]);const top=n[1]>0;const lt=top?1.15:(n[0]>0?.62:.82);
   const navy=[30,53,77],gold=[208,160,86];const col=navy.map((v,j)=>lerp(v,gold[j],goldK));
   const gr=c.createLinearGradient(pts[0][0],pts[0][1],pts[3][0],pts[3][1]);
   gr.addColorStop(0,`rgb(${col[0]*.45*lt*fog|0},${col[1]*.45*lt*fog|0},${col[2]*.5*lt*fog|0})`);gr.addColorStop(1,`rgb(${Math.min(255,col[0]*1.15*lt)*fog|0},${Math.min(255,col[1]*1.15*lt)*fog|0},${Math.min(255,col[2]*1.15*lt)*fog|0})`);c.fillStyle=gr;poly(c,pts);c.fill();
   // window-like horizontal light bands on side faces (organised structure)
   if(!top&&h>300&&goldK<.5){const nb=Math.floor(h/120);for(let k=1;k<nb;k++){const u=k/nb;const a1=[lerp(pts[0][0],pts[3][0],u),lerp(pts[0][1],pts[3][1],u)],a2=[lerp(pts[1][0],pts[2][0],u),lerp(pts[1][1],pts[2][1],u)];
     line(c,a1,a2,'214,161,59',.16*fog*lit(t),Math.max(1,F/d*3));}}
   if(cl_.red&&!top){const u=.9;const a1=[lerp(pts[0][0],pts[3][0],u),lerp(pts[0][1],pts[3][1],u)],a2=[lerp(pts[1][0],pts[2][0],u),lerp(pts[1][1],pts[2][1],u)];line(c,a1,a2,'147,50,49',.9*fog,Math.max(2,F/d*9));}}
  // edges: faint navy-white before the light, gold once lit
  const ea=(cl_.ring===0?lerp(.35,1,lit(t)):1)*fog;const lightK=cl_.ring===0?sm(t,1.8,3.6):sm(t,cl_.t0,cl_.t0+1);
  for(const [a,b] of EDG){if(!vis.has(Math.min(a,b)+'_'+Math.max(a,b)))continue;const col=lightK>.5?'250,226,170':'150,175,215';
   line(fx,Pp[a],Pp[b],'214,161,59',.18*ea*lightK,Math.max(2,F/d*12));line(fx,Pp[a],Pp[b],col,.75*ea,Math.max(1.2,F/d*3));}
  // light climbing the vertical edges while a block rises
  const rise=cl_.ring===0?sm(t,1.8,3.6):sm(t,cl_.t0,cl_.t0+2);if(rise>0&&rise<1){for(const k of [4,5,6,7]){const q=seg(V[k-4],V[k],rise);const Q=P(q);spr(SW,Q[0],Q[1],F/d*24,.85*fog);spr(SG,Q[0],Q[1],F/d*90,.4*fog)}}
 }
 // ---- bridges between neighbours + particles flowing (processes, teams, shared expertise)
 for(const br of bridges){const ha=hOf(br.a,t),hb=hOf(br.b,t);if(ha<20||hb<20)continue;const k=sm(t,Math.max(br.a.ring?br.a.t0:4,br.b.ring?br.b.t0:4)+1.6,Math.max(br.a.ring?br.a.t0:4,br.b.ring?br.b.t0:4)+2.6);if(k<=0)continue;
  const y=Math.min(ha,hb)*br.y;const A=[br.a.x,y,br.a.z],B=[br.b.x,y,br.b.z];const Pa=P(A),Pb=P(seg(A,B,k));const z=tr(A)[2];const fog=cl(1-(z-4000)/9000);
  line(fx,Pa,Pb,'214,161,59',.25*fog,Math.max(2,F/z*10));line(fx,Pa,Pb,'252,232,186',.8*fog,Math.max(1.2,F/z*2.6));
  if(k>=1){const u=(t*.4+br.ph)%1;const Q=P(seg(A,B,u));spr(SW,Q[0],Q[1],F/z*20,.9*fog);spr(SG,Q[0],Q[1],F/z*70,.4*fog);}}
 // crown light on the central tower and a calm pulse across the architecture
 const crown=sm(t,11.5,13.5);{const ht=Math.max(...core.map(c2=>hOf(c2,t)));const Q=P([0,ht+90,0]);const sc=F/tr([0,ht,0])[2];spr(SG,Q[0],Q[1],sc*1100,.3*crown);spr(SW,Q[0],Q[1],sc*70,.9*crown);
  for(const [len,rot] of [[1,0],[.7,Math.PI/2]]){fx.save();fx.translate(...Q);fx.rotate(rot);const L2=sc*700*len*crown;const lg=fx.createLinearGradient(-L2,0,L2,0);lg.addColorStop(0,'rgba(255,225,160,0)');lg.addColorStop(.5,`rgba(255,240,210,${.7*crown})`);lg.addColorStop(1,'rgba(255,225,160,0)');fx.fillStyle=lg;fx.globalAlpha=1;fx.beginPath();fx.ellipse(0,0,Math.max(1,L2),Math.max(1,sc*5),0,0,7);fx.fill();fx.restore();}}
 const pw=(t-13)/2.5;if(pw>0&&pw<1){const rr=pw*1700;const pts=[...Array(97)].map((_,i)=>{const a=i/96*6.283;return P([Math.cos(a)*rr,4,Math.sin(a)*rr])});fx.globalAlpha=1;fx.strokeStyle=`rgba(255,236,190,${.5*(1-pw)})`;fx.lineWidth=5;fx.beginPath();pts.forEach((q,i)=>i?fx.lineTo(...q):fx.moveTo(...q));fx.stroke();}
 // volumetric shafts + vignette
 fx.save();fx.translate(W*.6,-300);fx.rotate(.18);
 for(const [o,w,a] of [[0,640,.05],[-900,320,.035],[850,360,.03]]){const lg=fx.createLinearGradient(o-w,0,o+w,0);lg.addColorStop(0,'rgba(255,230,180,0)');lg.addColorStop(.5,`rgba(255,236,200,${a*fade})`);lg.addColorStop(1,'rgba(255,230,180,0)');fx.fillStyle=lg;fx.globalAlpha=1;fx.fillRect(o-w,0,2*w,3600);}
 fx.restore();fx.globalCompositeOperation='source-over';
 const v2=fx.createRadialGradient(cx,cy,H*.45,cx,cy,W*.62);v2.addColorStop(0,'rgba(4,9,16,0)');v2.addColorStop(1,'rgba(4,9,16,.6)');fx.fillStyle=v2;fx.fillRect(0,0,W,H);
};
window.ready=Promise.resolve(true).then(()=>{seek(0);return true});
</script></body></html>
