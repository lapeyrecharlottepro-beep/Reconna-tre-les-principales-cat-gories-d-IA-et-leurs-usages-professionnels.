<style>*{margin:0;padding:0}html,body{width:1920px;height:1080px;overflow:hidden;background:#000}canvas{position:absolute;inset:0;width:1920px;height:1080px}</style></head><body>
<canvas id="bg" width="3840" height="2160"></canvas><canvas id="c" width="3840" height="2160"></canvas><canvas id="fx" width="3840" height="2160" style="mix-blend-mode:screen"></canvas>
<script>
const W=3840,H=2160,cx=W/2,cy=H/2,F=2300,DUR=30;
const bgc=document.getElementById('bg').getContext('2d'),c=document.getElementById('c').getContext('2d'),fx=document.getElementById('fx').getContext('2d');
let seed=31415;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const cl=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)),sm=(t,a,b)=>{const k=cl((t-a)/(b-a));return k*k*(3-2*k)},lerp=(a,b,k)=>a+(b-a)*k;
const eio=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
function sprite(col){const s=document.createElement('canvas');s.width=s.height=128;const g=s.getContext('2d');const gr=g.createRadialGradient(64,64,0,64,64,64);
 gr.addColorStop(0,`rgba(${col},1)`);gr.addColorStop(.12,`rgba(${col},.85)`);gr.addColorStop(.3,`rgba(${col},.25)`);gr.addColorStop(1,`rgba(${col},0)`);g.fillStyle=gr;g.fillRect(0,0,128,128);return s;}
const SG=sprite('240,196,115'),SW=sprite('255,248,232'),SR=sprite('147,50,49');
function spr(img,x,y,r,a){if(a<=.004)return;fx.globalAlpha=Math.min(1,a);fx.drawImage(img,x-r,y-r,2*r,2*r);}
const rotY=(v,a)=>[v[0]*Math.cos(a)-v[2]*Math.sin(a),v[1],v[0]*Math.sin(a)+v[2]*Math.cos(a)],rotX=(v,a)=>[v[0],v[1]*Math.cos(a)-v[2]*Math.sin(a),v[1]*Math.sin(a)+v[2]*Math.cos(a)],rotZ=(v,a)=>[v[0]*Math.cos(a)-v[1]*Math.sin(a),v[0]*Math.sin(a)+v[1]*Math.cos(a),v[2]];
const add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],mul=(a,s)=>[a[0]*s,a[1]*s,a[2]*s];
const seg=(a,b,u)=>[lerp(a[0],b[0],u),lerp(a[1],b[1],u),lerp(a[2],b[2],u)];
const N=3000;
// ================= stage geometry =================
// S1 FORMALIZE: five stacked layers (documented, structured)
const LAY=[...Array(5)].map((_,l)=>({y:(l-2)*230,s:1150-l*70,r:(l-2)*.06}));
const layPt=(l,u,v)=>{const L=LAY[l];return rotY([(u-.5)*L.s,L.y,(v-.5)*L.s*.72],L.r)};
const layOutline=l=>[[0,0],[1,0],[1,1],[0,1],[0,0]].map(([u,v])=>layPt(l,u,v));
// S2 DIGITALIZE: three tiers of six interface modules around a core
const TIER=[-430,0,430],TR=820,TW=430,TH=250;
const tileFrame=(tr,i)=>{const a=i/6*Math.PI*2+tr*.5;const c0=[Math.cos(a)*TR,TIER[tr],Math.sin(a)*TR];const U=[-Math.sin(a),0,Math.cos(a)],V=[0,1,0];return {c0,U,V,a}};
const tilePt=(tr,i,u,v)=>{const f=tileFrame(tr,i);return add(f.c0,add(mul(f.U,(u-.5)*TW),mul(f.V,(v-.5)*TH)))};
// S3 TRAIN DIFFERENTLY: three open pathways + interactive spheres
const pathFn=(k,u)=>{const a=k*2.094+u*Math.PI*1.6;const r=1500-u*700;const y=-650+u*1300+Math.sin(u*Math.PI*3+k)*120;return [Math.cos(a)*r,y,Math.sin(a)*r]};
const SPH=[...Array(7)].map((_,i)=>{const k=i%3,u=.12+i*.12;const p=pathFn(k,u);return {c:add(p,[0,180,0]),r:110+(i%3)*40,k,u}});
// S4 AUTOMATE: three synchronized rings around a core
const RINGS=[{r:1050,tx:.35,tz:0},{r:930,tx:-.45,tz:.6},{r:810,tx:1.2,tz:-.4}];
const ringPt=(j,u,t)=>{const R=RINGS[j];let p=[Math.cos(u*6.2832)*R.r,0,Math.sin(u*6.2832)*R.r];p=rotZ(rotX(p,R.tx),R.tz);return rotY(p,t*.35*(j%2?-1:1))};
// S5 MEASURE: ring of rising bars on a base
const NB=12,BR=820,BW=150;
const barH=i=>340+620*(.5+.5*Math.cos((i/NB)*Math.PI*2-Math.PI*.15))*.85+80*(i%2);
const barRise=(i,t)=>eio(sm(t,25.2+i*.13,27.2+i*.13));
const barV=(i,t)=>{const a=i/NB*Math.PI*2,c0=[Math.cos(a)*BR,-560,Math.sin(a)*BR];const h=barH(i)*barRise(i,t);const U=[Math.cos(a),0,Math.sin(a)],T=[-Math.sin(a),0,Math.cos(a)];
 const o=[];for(const yy of [0,h])for(const [s1,s2] of [[-1,-1],[1,-1],[1,1],[-1,1]])o.push(add(c0,add(add(mul(U,s1*BW/2),mul(T,s2*BW/2)),[0,yy,0])));return o};
// ================= particle targets per stage =================
function S0(){const a=rnd()*6.28,b=Math.acos(rnd()*2-1),r=1200+Math.pow(rnd(),.6)*2600;return {p:[Math.cos(a)*Math.sin(b)*r,Math.cos(b)*r*.6,Math.sin(a)*Math.sin(b)*r]}}
function S1(){const l=Math.floor(rnd()*5),q=rnd();if(q<.35){const n=13;return {p:layPt(l,Math.floor(rnd()*n)/(n-1),Math.floor(rnd()*n)/(n-1))}}
 if(q<.8){const e=layOutline(l),k=Math.floor(rnd()*4);return {p:seg(e[k],e[k+1],rnd())}}
 if(q<.92){const v=rnd(),row=Math.floor(rnd()*4);return {p:layPt(l,.12+v*(.5+((row*37)%5)*.08),.2+row*.17)}}
 const cr=[[0,0],[1,0],[1,1],[0,1]][Math.floor(rnd()*4)];const a=layPt(0,...cr),b=layPt(4,...cr);return {p:seg(a,b,rnd())}}
function S2(){const q=rnd();if(q<.82){const tr=Math.floor(rnd()*3),i=Math.floor(rnd()*6),w=rnd();
  if(w<.6){const e=[[0,0],[1,0],[1,1],[0,1],[0,0]],k=Math.floor(rnd()*4),u=rnd();return {p:tilePt(tr,i,lerp(e[k][0],e[k+1][0],u),lerp(e[k][1],e[k+1][1],u))}}
  if(w<.8){const row=Math.floor(rnd()*3);return {p:tilePt(tr,i,.1+rnd()*.45,.25+row*.22)}}
  const a=rnd()*6.28;return {p:tilePt(tr,i,.75+Math.cos(a)*.13,.5+Math.sin(a)*.22)}}
 if(q<.92){return {p:[0,(rnd()-.5)*1100,0]}}
 const tr=Math.floor(rnd()*3),i=Math.floor(rnd()*6);return {p:seg([0,TIER[tr],0],tileFrame(tr,i).c0,rnd())}}
function S3(){const q=rnd();if(q<.62){const k=Math.floor(rnd()*3);return {p:pathFn(k,rnd()),tag:'path'}}
 const s=SPH[Math.floor(rnd()*SPH.length)];const a=rnd()*6.28,b=Math.acos(rnd()*2-1);return {p:add(s.c,[Math.cos(a)*Math.sin(b)*s.r,Math.cos(b)*s.r,Math.sin(a)*Math.sin(b)*s.r]),sph:s}}
function S4(){const q=rnd();if(q<.84){return {ring:Math.floor(rnd()*3),u:rnd()}}const j=Math.floor(rnd()*3),u=Math.floor(rnd()*6)/6;return {spoke:j,u,v:rnd()}}
function S5(){const q=rnd();if(q<.7){const i=Math.floor(rnd()*NB),e=Math.floor(rnd()*12),v=rnd();return {bar:i,e,v}}
 const a=rnd()*6.28,r=rnd()<.5?1120:560;return {p:[Math.cos(a)*r,-560,Math.sin(a)*r]}}
const EDG=[[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]];
function targetPos(s,T,t){switch(s){
 case 3:{if(T.sph){const b=Math.sin(t*1.6+T.sph.u*9)*40;return add(T.p,[0,b,0])}return T.p}
 case 4:{if(T.ring!=null)return ringPt(T.ring,T.u,t);const p=ringPt(T.spoke,T.u,t);return seg([0,0,0],p,T.v)}
 case 5:{if(T.bar!=null){const V=barV(T.bar,t);const [a,b]=EDG[T.e];return seg(V[a],V[b],T.v)}return T.p}
 default:return T.p}}
const GEN=[S0,S1,S2,S3,S4,S5];
const TG=GEN.map((g,s)=>{const arr=[...Array(N)].map(()=>g());
 // order by angle + height so morphs flow in organised sweeps
 const key=T=>{const p=T.p||(T.ring!=null?ringPt(T.ring,T.u,0):T.bar!=null?barV(T.bar,30)[0]:ringPt(T.spoke,T.u,0));return Math.floor((Math.atan2(p[2],p[0])+Math.PI)/6.2832*24)*1e5+(p[1]+5000)};
 return arr.sort((a,b)=>key(a)-key(b))});
const MORPH=[[1.4,5],[6.6,9.2],[12,14.6],[18,20.6],[24,26.6]];
const PS=[...Array(N)].map((_,i)=>({d:i/N,ph:rnd()*6.28,s:rnd()}));
// ================= camera =================
let CAM;
function lookAt(p,tg){let f=[tg[0]-p[0],tg[1]-p[1],tg[2]-p[2]];let n=Math.hypot(...f);f=f.map(v=>v/n);let r=[f[2],0,-f[0]];n=Math.hypot(...r);r=r.map(v=>v/n);

const KF=[[0,3700,.22],[5,2850,.5],[10.5,2750,.2],[16.5,3500,.34],[22.5,3000,.18],[28.6,3450,.3],[30,3450,.3]];
const speed=t=>Math.max(.004,.07+.07*sm(t,9,15)+.11*sm(t,15,21)-.25*sm(t,22.5,28.6));
const AZ=[0];for(let i=1;i<=3000;i++)AZ.push(AZ[i-1]+speed(i*.01)*.01);
function setCam(t){let k=0;while(k<KF.length-2&&t>KF[k+1][0])k++;const a=KF[k],b=KF[k+1];const u=sm(t,a[0],b[0]);const dist=lerp(a[1],b[1],u),el=lerp(a[2],b[2],u);
 const az=-.9+AZ[Math.min(3000,Math.floor(t*100))];lookAt([Math.cos(az)*Math.cos(el)*dist,Math.sin(el)*dist,Math.sin(az)*Math.cos(el)*dist],[0,lerp(0,-80,sm(t,24,28)),0]);}
function tr(q){const d=[q[0]-CAM.p[0],q[1]-CAM.p[1],q[2]-CAM.p[2]];return [d[0]*CAM.r[0]+d[1]*CAM.r[1]+d[2]*CAM.r[2],d[0]*CAM.u[0]+d[1]*CAM.u[1]+d[2]*CAM.u[2],d[0]*CAM.f[0]+d[1]*CAM.f[1]+d[2]*CAM.f[2]];}
const pr=q=>[cx-q[0]*F/q[2],cy+q[1]*F/q[2]];const P=v=>pr(tr(v));
function line3(pts,prog,col,a,w=2.6,gw=11){if(prog<=0||a<=.004)return null;const n=pts.length-1,m=prog*n,k=Math.floor(m);const Q=[];for(let i=0;i<=Math.min(k,n);i++)Q.push(P(pts[i]));
 if(k<n)Q.push(P(seg(pts[k],pts[k+1],m-k)));if(Q.length<2)return Q[0];const C={g:['214,161,59','255,236,190'],w:['170,195,235','236,242,255'],r:['147,50,49','214,110,104']}[col];
 fx.globalAlpha=1;for(const [ww,aa,cc] of [[gw,.2,C[0]],[w,.92,C[1]]]){fx.strokeStyle=`rgba(${cc},${aa*a})`;fx.lineWidth=ww;fx.beginPath();Q.forEach((q,i)=>i?fx.lineTo(q[0],q[1]):fx.moveTo(q[0],q[1]));fx.stroke();}return Q[Q.length-1];}
function poly(g,pts){g.beginPath();g.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)g.lineTo(pts[i][0],pts[i][1]);g.closePath();}
const vis=(t,a,b,c2,d)=>sm(t,a,b)*(1-sm(t,c2,d));
const dust=[...Array(380)].map(()=>({p:[(rnd()-.5)*10000,(rnd()-.5)*6000,(rnd()-.5)*10000],s:rnd(),ph:rnd()*6.28}));
window.DURATION=DUR;
window.seek=t=>{setCam(t);const fade=sm(t,0,1);
 bgc.fillStyle='#070f1a';bgc.fillRect(0,0,W,H);
 let g=bgc.createRadialGradient(cx,cy,0,cx,cy,W*.7);g.addColorStop(0,'rgba(30,53,77,1)');g.addColorStop(.6,'rgba(18,34,52,1)');g.addColorStop(1,'rgba(7,15,26,1)');bgc.fillStyle=g;bgc.fillRect(0,0,W,H);
 c.clearRect(0,0,W,H);fx.clearRect(0,0,W,H);fx.globalCompositeOperation='lighter';fx.lineCap=fx.lineJoin='round';
 for(const d of dust){const q=tr(d.p);if(q[2]<300)continue;const Q=pr(q);spr(SG,Q[0],Q[1],Math.max(2,F/q[2]*11),.15*fade*(.5+.5*Math.sin(t*.8+d.ph)));}
 // core glow
 const C0=P([0,0,0]);const zc=tr([0,0,0])[2];spr(SG,C0[0],C0[1],F/zc*1400,.10+.05*sm(t,18,22)-.05*sm(t,24,27));
 // ---------- stage lines ----------
 // S1 layers
 {const v=vis(t,3.4,5.2,6.8,8.6);if(v>0){for(let l=0;l<5;l++){line3(layOutline(l),sm(t,3.4+l*.18,4.9+l*.18),'g',v*.95);
   for(let r=0;r<4;r++){const len=.5+((r*37+l*11)%5)*.08;line3([layPt(l,.12,.2+r*.17),layPt(l,.12+len,.2+r*.17)],sm(t,4.2+l*.12+r*.08,5.2+l*.12+r*.08),'w',v*.45,1.4,5)}}
   for(const cr of [[0,0],[1,0],[1,1],[0,1]])line3([layPt(0,...cr),layPt(4,...cr)],sm(t,4.6,5.6),'w',v*.3,1.2,4);}}
 // S2 interface ecosystem
 {const v=vis(t,8.2,9.8,12.2,14);if(v>0){for(let tr2=0;tr2<3;tr2++)for(let i=0;i<6;i++){const pd=sm(t,8.2+(tr2*6+i)*.05,9.6+(tr2*6+i)*.05);
    line3([[0,0],[1,0],[1,1],[0,1],[0,0]].map(([u,w])=>tilePt(tr2,i,u,w)),pd,'w',v*.85,2.2,9);
    for(let r=0;r<3;r++)line3([tilePt(tr2,i,.1,.25+r*.22),tilePt(tr2,i,.1+.18+((r+i)%3)*.1,.25+r*.22)],pd,'g',v*.6,1.6,6);
    const f=tileFrame(tr2,i);line3([...Array(25)].map((_,k)=>{const a=k/24*6.2832;return tilePt(tr2,i,.75+Math.cos(a)*.13,.5+Math.sin(a)*.22)}),pd,'g',v*.7,1.6,6);
    line3([[0,TIER[tr2],0],f.c0],sm(t,9,10.2),'g',v*.45,1.4,6);
    line3([f.c0,tileFrame(tr2,(i+1)%6).c0],sm(t,9.3,10.5),'w',v*.25,1.2,4);}
   line3([[0,-600,0],[0,600,0]],sm(t,8.6,9.8),'g',v*.8,2.4,10);
   // data pulses travelling to the core
   for(let k=0;k<18;k++){const tr2=k%3,i=Math.floor(k/3);const u=((t*.45+k*.137)%1);const p=seg(tileFrame(tr2,i).c0,[0,TIER[tr2],0],u);const Q=P(p);spr(SW,Q[0],Q[1],16,.9*v*sm(t,9.6,10.4));spr(SG,Q[0],Q[1],55,.4*v*sm(t,9.6,10.4));}}}
 // S3 learning environment
 {const v=vis(t,13.4,15.2,18.4,20.4);if(v>0){for(let k=0;k<3;k++){const pts=[...Array(121)].map((_,i)=>pathFn(k,i/120));line3(pts,sm(t,13.4+k*.3,15.6+k*.3),'g',v,2.8,13);
    // a learner moving along each pathway (experimentation in action)
    const u=((t-14)*.12+k*.33)%1;const Q=P(pathFn(k,u));spr(SW,Q[0],Q[1],24,v*.95);spr(SG,Q[0],Q[1],90,v*.5);}
   SPH.forEach((s,i)=>{const b=Math.sin(t*1.6+s.u*9)*40;const c1=add(s.c,[0,b,0]);const pd=sm(t,14+i*.15,15.4+i*.15);
    for(let m=0;m<4;m++){const lon=m*Math.PI/4+t*.4;line3([...Array(33)].map((_,j)=>{const a=j/32*6.2832;return add(c1,rotY([Math.cos(a)*s.r,Math.sin(a)*s.r,0],lon))}),pd,'w',v*.55,1.4,5)}
    line3([...Array(33)].map((_,j)=>{const a=j/32*6.2832;return add(c1,[Math.cos(a)*s.r,0,Math.sin(a)*s.r])}),pd,i%3===1?'r':'g',v*.8,1.8,8);
    // small orbiting satellites (abstract simulation)
    for(let o=0;o<2;o++){const a=t*(1.4+o*.6)+i;const Q=P(add(c1,rotX([Math.cos(a)*s.r*1.6,0,Math.sin(a)*s.r*1.6],.5+o)));spr(SW,Q[0],Q[1],9,.9*v*pd);spr(SG,Q[0],Q[1],30,.4*v*pd)}

 // S4 automation: synchronized rings, spokes, light pulses
 {const v=vis(t,19.4,21,24.4,26.4);if(v>0){for(let j=0;j<3;j++){line3([...Array(121)].map((_,i)=>ringPt(j,i/120,t)),sm(t,19.4+j*.25,21+j*.25),j===1?'w':'g',v,2.6,12);
    for(let s2=0;s2<6;s2++){const p=ringPt(j,s2/6,t);line3([[0,0,0],p],sm(t,20.4,21.4),'w',v*.22,1.1,4);const Q=P(p);spr(SW,Q[0],Q[1],14,.9*v);spr(j===2&&s2%2?SR:SG,Q[0],Q[1],52,.55*v)}

   const Q=P([0,0,0]);spr(SW,Q[0],Q[1],40,.9*v);spr(SG,Q[0],Q[1],260,.35*v*(.8+.2*Math.sin(t*4)));}}
 // ---------- S5 measure: bars (solid, painter's order) ----------
 const v5=sm(t,24.6,26.2);
 if(v5>0){line3([...Array(121)].map((_,i)=>{const a=i/120*6.2832;return [Math.cos(a)*1120,-560,Math.sin(a)*1120]}),sm(t,24.6,26),'g',v5,2.6,12);
  line3([...Array(121)].map((_,i)=>{const a=i/120*6.2832;return [Math.cos(a)*560,-560,Math.sin(a)*560]}),sm(t,24.9,26.3),'r',v5*.85,2.2,10);
  const order=[...Array(NB).keys()].map(i=>({i,d:tr(barV(i,t)[0])[2]})).sort((a,b)=>b.d-a.d);

   const camP=CAM.p,a=i/NB*Math.PI*2;
   for(const [ix,n] of [[[0,1,5,4],[0,0,-1]],[[1,2,6,5],[1,0,0]],[[2,3,7,6],[0,0,1]],[[3,0,4,7],[-1,0,0]],[[4,5,6,7],[0,1,0]]]){
    const ctr=ix.map(k=>V[k]).reduce((s,p)=>[s[0]+p[0]/4,s[1]+p[1]/4,s[2]+p[2]/4],[0,0,0]);const bc=V.reduce((s,p)=>[s[0]+p[0]/8,s[1]+p[1]/8,s[2]+p[2]/8],[0,0,0]);let nn=n[1]?[0,1,0]:[ctr[0]-bc[0],0,ctr[2]-bc[2]];{const l=Math.hypot(...nn)||1;nn=nn.map(x=>x/l)}

    const gr=c.createLinearGradient(pts[0][0],pts[0][1],pts[3][0],pts[3][1]);const lt=nn[1]?1.1:.55+.45*Math.abs(nn[0]*.7+nn[2]*.3);

   fx.globalAlpha=1;for(const [p0,p1] of [[4,5],[5,6],[6,7],[7,4],[1,5],[2,6]]){fx.strokeStyle=`rgba(250,236,200,${.6*v5})`;fx.lineWidth=2;fx.beginPath();fx.moveTo(...Pp[p0]);fx.lineTo(...Pp[p1]);fx.stroke();}
   // indicator lighting up on top
