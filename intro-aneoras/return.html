<!doctype html><html><head><meta charset="utf-8"><title>ANEORAS return to the star</title>
<style>
@font-face{font-family:'Montserrat';font-weight:300;src:url(fonts/montserrat-latin-300-normal.woff2) format('woff2')}
@font-face{font-family:'Montserrat';font-weight:500;src:url(fonts/montserrat-latin-500-normal.woff2) format('woff2')}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#05254E}
.l{position:absolute;inset:0}
#logo{position:absolute;left:50%;top:470px;width:1300px;transform:translate(-50%,-50%)}
#logo img{width:100%;display:block}
#tag{position:absolute;left:0;right:0;top:672px;display:flex;justify-content:center;align-items:center;gap:34px;font-family:Montserrat;font-weight:300;font-size:40px;letter-spacing:.14em;color:#fff}
#tag .ln{width:90px;height:1.5px;background:linear-gradient(90deg,rgba(214,161,59,0),#D6A13B)}
#tag .ln.r{background:linear-gradient(90deg,#D6A13B,rgba(214,161,59,0))}
#tag b{font-weight:500;color:#E2B65C}
</style></head><body>
<canvas id="c" class="l" width="3840" height="2160" style="width:1920px;height:1080px"></canvas>
<div id="glow" class="l" style="background:radial-gradient(ellipse 900px 330px at 50% 470px,rgba(214,161,59,.32),rgba(214,161,59,0) 70%);opacity:0"></div>
<div id="logo"><img src="logo_rgba.png"></div>
<div id="tag"><span class="ln"></span><span id="tt">Votre potentiel<b>.</b> Notre stratégie<b>.</b></span><span class="ln r"></span></div>
<canvas id="fx" class="l" width="3840" height="2160" style="width:1920px;height:1080px;mix-blend-mode:screen"></canvas>
<script>
const W=3840,H=2160,cx=W/2,cy=H/2;
const c=document.getElementById('c').getContext('2d'),fx=document.getElementById('fx').getContext('2d');
const $=id=>document.getElementById(id);
let seed=23;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const parts=[...Array(220)].map(()=>({x:(rnd()-.5)*W*1.3,y:(rnd()-.5)*H*1.3,z:.35+rnd()*.9,s:rnd(),ph:rnd()*6.28,vx:(rnd()-.5)*30,vy:-8-rnd()*22,g:rnd()}));
// night-side city lights on the Earth (angle around limb, depth below limb)
const ER=9000;const lights=[...Array(900)].map(()=>{const cl=rnd();return {a:(rnd()-.5)*.42+(cl<.5?-.06:.09)*rnd(),d:40+Math.pow(rnd(),1.6)*900,s:rnd()}});
const cl=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const sm=(t,a,b)=>{const k=cl((t-a)/(b-a));return k*k*(3-2*k)};
const eio=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
function star(g,x,y,r,a,rays=1){if(a<=0||r<=0)return;g.save();g.globalAlpha=a;
 let gr=g.createRadialGradient(x,y,0,x,y,r*7);gr.addColorStop(0,'rgba(255,238,200,.5)');gr.addColorStop(.3,'rgba(226,182,92,.16)');gr.addColorStop(1,'rgba(214,161,59,0)');
 g.fillStyle=gr;g.beginPath();g.arc(x,y,r*7,0,7);g.fill();
 for(const [len,th,rot] of [[r*5.5*rays,r*.07,0],[r*3.6*rays,r*.06,Math.PI/2],[r*1.8*rays,r*.04,Math.PI/4],[r*1.8*rays,r*.04,-Math.PI/4]]){
  g.save();g.translate(x,y);g.rotate(rot);const lg=g.createLinearGradient(-len,0,len,0);
  lg.addColorStop(0,'rgba(255,215,140,0)');lg.addColorStop(.5,'rgba(255,246,222,.9)');lg.addColorStop(1,'rgba(255,215,140,0)');
  g.fillStyle=lg;g.beginPath();g.ellipse(0,0,len,Math.max(th,1.2),0,0,7);g.fill();g.restore();}
 gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,'#fffdf7');gr.addColorStop(.45,'rgba(255,236,185,.92)');gr.addColorStop(1,'rgba(255,205,110,0)');
 g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,7);g.fill();g.restore();}
const LW=1300,LH=LW*646/3162,LSX=(960-LW/2+LW*.1847)*2,LSY=(470-LH/2+LH*.186)*2;
const FREEZE=4.4;window.DURATION=6.5;
window.seek=T=>{const t=Math.min(T,FREEZE);   // everything is perfectly still after FREEZE
 c.clearRect(0,0,W,H);fx.clearRect(0,0,W,H);
 // sky: atmospheric blue near the horizon fading to deep space navy
 const atm=1-sm(t,.2,2.6);
 c.fillStyle='#020c1c';c.fillRect(0,0,W,H);
 let bg=c.createRadialGradient(cx,cy,0,cx,cy,W*.62);bg.addColorStop(0,'rgba(12,48,96,.85)');bg.addColorStop(.55,'rgba(5,37,78,.55)');bg.addColorStop(1,'rgba(2,12,28,0)');
 c.fillStyle=bg;c.fillRect(0,0,W,H);
 // Earth limb sinking out of frame as the camera rises
 const lim=1580+eio(cl(t/2.6))*1250;            // canvas y of the limb top
 if(lim<H+400){const ecx=cx-500,ecy=lim+ER;
  let ag=c.createLinearGradient(0,lim-900,0,lim);ag.addColorStop(0,'rgba(40,110,200,0)');ag.addColorStop(1,`rgba(70,140,220,${.38*atm+.1})`);
  c.fillStyle=ag;c.fillRect(0,lim-900,W,900);c.fillStyle=`rgba(70,140,220,${.38*atm+.1})`;c.fillRect(0,lim,W,H);
  // atmosphere halo
  let hg=c.createRadialGradient(ecx,ecy,ER-10,ecx,ecy,ER+260);hg.addColorStop(0,'rgba(120,180,255,.75)');hg.addColorStop(.12,'rgba(90,150,235,.45)');hg.addColorStop(.45,'rgba(40,90,180,.14)');hg.addColorStop(1,'rgba(20,50,120,0)');
  c.fillStyle=hg;c.beginPath();c.arc(ecx,ecy,ER+260,0,7);c.fill();
  // planet body
  let eg=c.createRadialGradient(ecx,ecy-ER*.2,ER*.6,ecx,ecy,ER);eg.addColorStop(0,'#01050c');eg.addColorStop(.92,'#03101f');eg.addColorStop(1,'#0b2a52');
  c.fillStyle=eg;c.beginPath();c.arc(ecx,ecy,ER,0,7);c.fill();
  // warm golden sunrise sliver on the right of the limb
  c.save();c.beginPath();c.arc(ecx,ecy,ER+40,0,7);c.arc(ecx,ecy,ER-6,0,7,true);c.clip();
  let sg=c.createRadialGradient(cx+1500,lim,0,cx+1500,lim,1600);sg.addColorStop(0,'rgba(255,214,140,.8)');sg.addColorStop(.4,'rgba(230,170,80,.35)');sg.addColorStop(1,'rgba(230,170,80,0)');
  c.fillStyle=sg;c.fillRect(0,0,W,H);c.restore();
  // city lights on the night side
  for(const L of lights){const ang=-Math.PI/2+L.a,r=ER-L.d;const x=ecx+Math.cos(ang)*r,y=ecy+Math.sin(ang)*r;if(y>H+5||x<0||x>W)continue;
   const a=(.25+.6*L.s)*(1-L.d/1000);c.fillStyle=`rgba(255,${190+L.s*40|0},120,${a})`;c.fillRect(x,y,1.6+L.s*2.2,1.2+L.s*1.4);}
 }
 // fade to charter navy for the end card
 const navyA=sm(t,3.0,4.4);if(navyA>0){c.globalAlpha=navyA;c.fillStyle='#05254E';c.fillRect(0,0,W,H);c.globalAlpha=1;}
 // particles appear above the atmosphere
 const dz=1+.14*eio(cl(t/3.6));const pa=sm(t,.6,2.0)*(1-.75*sm(t,3,4.4));
 for(const p of parts){let x=(p.x+p.vx*t+Math.sin(t*.6+p.ph)*20)*dz*(1+(p.z-.8)*(dz-1)*2),y=(p.y+p.vy*t)*dz*(1+(p.z-.8)*(dz-1)*2);
  const px=cx+x,py=cy+y;if(py>lim-40)continue;const r=(2+p.s*7)*p.z;const a=pa*(.25+.55*p.s)*(.6+.4*Math.sin(t*1.7+p.ph));if(a<=.01)continue;
  const col=p.g>.55?'255,226,165':'225,235,255';const gr=c.createRadialGradient(px,py,0,px,py,r*3);
  gr.addColorStop(0,`rgba(${col},${a})`);gr.addColorStop(.35,`rgba(${col},${a*.45})`);gr.addColorStop(1,`rgba(${col},0)`);c.fillStyle=gr;c.beginPath();c.arc(px,py,r*3,0,7);c.fill();}
 // the ANEORAS star: distant glow -> brighter -> glides into the logo star
 const mv=eio(cl((t-2.9)/1.1));const sx=cx+(LSX-cx)*mv,sy=cy+(LSY-cy)*mv;
 const sr=(7+40*Math.pow(sm(t,.6,2.9),1.4))*(1-.8*mv)*(1+.04*Math.sin(t*7));
 star(fx,sx,sy,sr,sm(t,.3,1.3)*(1-sm(t,3.7,4.2)),.6+.6*sm(t,1.2,2.9));
 // logo emerges from the light
 const la=sm(t,2.9,4.0);$('logo').style.opacity=la.toFixed(3);
 $('logo').style.filter=`blur(${((1-sm(t,2.9,3.9))*10).toFixed(2)}px) brightness(${(.6+.4*la).toFixed(3)})`;
 $('glow').style.opacity=(sm(t,2.8,3.6)*(1-.8*sm(t,3.7,4.4))).toFixed(3);
 const ga=sm(t,3.5,4.4);$('tag').style.opacity=ga.toFixed(3);$('tag').style.transform=`translateY(${((1-ga)*14).toFixed(2)}px)`;
 $('tt').style.letterSpacing=(0.14+0.1*(1-ga)).toFixed(3)+'em';
};
window.ready=Promise.all([new Promise(r=>{const i=document.querySelector('#logo img');i.complete?r():i.onload=r}),document.fonts.load('300 40px Montserrat'),document.fonts.load('500 40px Montserrat')]).then(()=>{seek(0);return true});
</script></body></html>
