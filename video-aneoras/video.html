<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>ANEORAS — FormaNova</title>
<style>
@font-face{font-family:'Montserrat';font-weight:300;src:url(fonts/montserrat-latin-300-normal.woff2) format('woff2')}
@font-face{font-family:'Montserrat';font-weight:400;src:url(fonts/montserrat-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Montserrat';font-weight:500;src:url(fonts/montserrat-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Montserrat';font-weight:600;src:url(fonts/montserrat-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Montserrat';font-weight:700;src:url(fonts/montserrat-latin-700-normal.woff2) format('woff2')}
:root{--navy:#05254E;--navy2:#0a3468;--red:#B71932;--gold:#D6A13B;--goldL:#F4D58A;--goldD:#B88626;--grey:#E8E8EB;--dark:#2B2B2B;--bg:#F7F7F9}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#000;font-family:'Montserrat',sans-serif;-webkit-font-smoothing:antialiased}
#stage{position:absolute;inset:0;overflow:hidden;background:var(--navy)}
.scene{position:absolute;inset:0;overflow:hidden}
.navy{background:radial-gradient(ellipse 90% 80% at 72% 28%,#0d3b74 0%,#05254E 55%,#031b3b 100%);color:#fff}
.light{background:var(--bg);color:var(--navy)}
.white{background:#fff;color:var(--navy)}
.abs{position:absolute}
.tag{font-weight:600;font-size:22px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:18px}
.tag::before{content:'';width:56px;height:3px;background:currentColor;border-radius:2px}
.tag.red{color:var(--red)}
.h2{font-size:62px;font-weight:700;line-height:1.15;letter-spacing:-.01em}
.goldtxt{background:linear-gradient(100deg,#B88626 0%,#F4D58A 50%,#D6A13B 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.gold{color:var(--gold)} .redc{color:var(--red)}
.card{background:#fff;border-radius:20px;box-shadow:0 14px 44px rgba(5,37,78,.10)}
.mini{position:absolute;right:70px;bottom:46px;display:flex;align-items:center;gap:14px;opacity:.9}
.mini .w{font-size:20px;letter-spacing:.42em;font-weight:500}

.pill{display:inline-flex;align-items:center;gap:14px;border-radius:999px;padding:16px 28px;font-size:25px;font-weight:600}
.pill.red{background:#fbe9ec;color:var(--red);border:2px solid rgba(183,25,50,.25)}
.pill.navy{background:#e9eef6;color:var(--navy)}
.mask{overflow:hidden;display:inline-block;vertical-align:top}
.mask>span{display:inline-block}
/* consequences */
.grid3{position:absolute;left:140px;top:340px;width:1640px;display:grid;grid-template-columns:repeat(3,1fr);gap:34px}
.ccard{height:270px;padding:40px 40px 0;position:relative;overflow:hidden}
.cico{width:76px;height:76px;border-radius:50%;background:#fbe9ec;display:flex;align-items:center;justify-content:center;margin-bottom:26px}
.ctext{font-size:29px;font-weight:600;line-height:1.3;color:var(--navy)}
.cline{position:absolute;left:0;bottom:0;height:6px;width:100%;background:var(--red);transform-origin:left}
/* solution */
.node{position:absolute;width:150px;text-align:center}
.ncirc{width:150px;height:150px;border-radius:50%;background:#062c5c;border:3px solid var(--gold);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 10px rgba(214,161,59,.08)}
.nnum{font-size:22px;font-weight:700;color:var(--gold);letter-spacing:.15em;margin-bottom:16px}
.nlab{position:absolute;left:-60px;top:210px;width:270px;font-size:27px;font-weight:600;line-height:1.3;color:#fff}
.tile{position:absolute;width:360px;height:124px;display:flex;align-items:center;gap:22px;padding:0 26px}
.tico{width:72px;height:72px;border-radius:16px;background:#e9eef6;display:flex;align-items:center;justify-content:center;flex:none}
.tt1{font-size:25px;font-weight:700;color:var(--navy)}
.tt2{font-size:19px;font-weight:500;color:#6b7690;margin-top:4px}
.row{height:84px;display:flex;align-items:center;gap:24px;padding:0 30px;margin-bottom:14px}
.row .tx{flex:1;font-size:28px;font-weight:600;color:var(--navy)}
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;background:linear-gradient(140deg,#0d3b74,#05254E);box-shadow:0 0 0 6px var(--gold)}
.quote{font-size:66px;font-weight:700;line-height:1.25;text-align:center;color:#fff}
</style>
</head>
<body>
<div id="stage"></div>
<script>
/* ---------- helpers ---------- */
const stage=document.getElementById('stage');
CSS.registerProperty({name:'--n',syntax:'<integer>',inherits:false,initialValue:'0'});
const ANIMS=[],HOOKS=[];
const E={out:'cubic-bezier(.16,1,.3,1)',inout:'cubic-bezier(.65,0,.35,1)',back:'cubic-bezier(.34,1.56,.64,1)',lin:'linear',in:'cubic-bezier(.55,0,1,.45)'};
function $$(root,sel){return typeof sel==='string'?[...root.querySelectorAll(sel)]:(Array.isArray(sel)?sel:[sel])}
function A(el,kf,start,dur,o={}){const a=el.animate(kf,{delay:start*1000,duration:dur*1000,easing:o.e||E.out,fill:o.fill||'both',iterations:o.it||1,direction:o.dir||'normal'});a.pause();ANIMS.push(a);return a}
const fadeUp=(el,t,d=.9,y=40)=>A(el,[{opacity:0,transform:`translateY(${y}px)`},{opacity:1,transform:'none'}],t,d);
const fadeIn=(el,t,d=.8)=>A(el,[{opacity:0},{opacity:1}],t,d,{e:E.inout});
const fadeOut=(el,t,d=.5)=>A(el,[{opacity:1},{opacity:0}],t,d,{e:E.inout,fill:'forwards'});
const pop=(el,t,d=.7)=>A(el,[{opacity:0,transform:'scale(.6)'},{opacity:1,transform:'scale(1)'}],t,d,{e:E.back});
const slideX=(el,t,d=.9,x=-60)=>A(el,[{opacity:0,transform:`translateX(${x}px)`},{opacity:1,transform:'none'}],t,d);
const reveal=(el,t,d=1)=>A(el,[{clipPath:'inset(0 100% 0 0)'},{clipPath:'inset(0 0% 0 0)'}],t,d,{e:E.inout});
const float=(el,t,amp=10,per=2.4,rot=0)=>A(el,[{transform:`translateY(${-amp}px) rotate(${rot}deg)`},{transform:`translateY(${amp}px) rotate(${-rot}deg)`}],t,per,{e:E.inout,it:40,dir:'alternate',fill:'both'});
function stagger(els,t,step,fn){els.forEach((e,i)=>fn(e,t+i*step))}
/* split text into masked words that slide up */
function words(txt,cls=''){return txt.split(/\s+/).filter(Boolean).map(w=>{let c=cls;const m=w.match(/^\*(.+)\*$/);if(m){w=m[1];c='gold'}return `<span class="mask"><span class="${c}">${w}</span></span>`}).join(' ')}
function wordsIn(root,t,step=.06,d=.8){$$(root,'.mask>span').forEach((s,i)=>A(s,[{transform:'translateY(110%)'},{transform:'none'}],t+i*step,d))}

/* ---------- icons ---------- */
const IC={
alert:'<path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>',
mail:'<path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>',
file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>',
grid:'<rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/>',
clock:'<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
euro:'<path d="M18 6.5A7 7 0 1 0 18 17.5"/><line x1="4" y1="10" x2="13" y2="10"/><line x1="4" y1="14" x2="13" y2="14"/>',
eyeoff:'<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/><line x1="2" y1="2" x2="22" y2="22"/>',
shuffle:'<polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/>',
users:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
down:'<polyline points="23 18 13.5 8.5 8.5 13.5 1 6"/><polyline points="17 18 23 18 23 12"/>',
up:'<polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/>',
repeat:'<polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>',
xcircle:'<circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>',
layers:'<polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/>',
target:'<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',
bars:'<line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>',
search:'<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>',
check:'<polyline points="20 6 9 17 4 12"/>',
monitor:'<rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>',
play:'<circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/>',
sliders:'<line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/>',
zap:'<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>',
db:'<ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/>',
book:'<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>',
tag:'<path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/>',
award:'<circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/>',
pen:'<path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>',
video:'<polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/>',
send:'<line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>',
usercheck:'<path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><polyline points="17 11 19 13 23 9"/>',
bell:'<path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>',
folder:'<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>',
clip:'<path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/>',
copy:'<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
expand:'<polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/>',
slash:'<circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/>',
detour:'<polyline points="15 14 20 9 15 4"/><path d="M4 20v-7a4 4 0 0 1 4-4h12"/>',
hub:'<circle cx="12" cy="12" r="3.2"/><circle cx="4" cy="4" r="2"/><circle cx="20" cy="4" r="2"/><circle cx="4" cy="20" r="2"/><circle cx="20" cy="20" r="2"/><line x1="5.5" y1="5.5" x2="9.7" y2="9.7"/><line x1="18.5" y1="5.5" x2="14.3" y2="9.7"/><line x1="5.5" y1="18.5" x2="9.7" y2="14.3"/><line x1="18.5" y1="18.5" x2="14.3" y2="14.3"/>',
route:'<circle cx="6" cy="19" r="3"/><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"/><circle cx="18" cy="5" r="3"/>',
help:'<circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/>',
arrow:'<line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>',
cal:'<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>',
};
const ico=(n,s=32,c='currentColor',w=1.8)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${IC[n]}</svg>`;

/* ---------- logo ---------- */
let UID=0;
const VB='0 -14 312 272';
function logoIcon(apex){const id='g'+(UID++);
 const sv=b=>`<svg viewBox="${VB}" style="position:absolute;inset:0;width:100%;height:100%;overflow:visible">${b}</svg>`;
 return `<div class="lg-apex" style="position:absolute;inset:0">${sv(`<polygon fill="${apex}" points="122,16 172,112 151,127 122,72 54,206 26,206"/>`)}</div>
 <div class="lg-red" style="position:absolute;inset:0">${sv(`<polygon fill="#B71932" points="150,125 176,118 246,252 213,252"/>`)}</div>
 <div class="lg-sw" style="position:absolute;inset:0">${sv(`<defs><linearGradient id="${id}" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#B88626"/><stop offset=".55" stop-color="#F4D58A"/><stop offset="1" stop-color="#D6A13B"/></linearGradient></defs><path fill="url(#${id})" d="M6,254 C58,170 150,98 262,46 C166,108 96,172 42,254 Z"/>`)}</div>
 <div class="lg-star" style="position:absolute;inset:0">${sv(`<path fill="#E7BC62" d="M278,-6 L282.5,15.5 L304,20 L282.5,24.5 L278,46 L273.5,24.5 L252,20 L273.5,15.5 Z"/>`)}</div>`;}
function letter(ch,col,gold){const st=`stroke="${col}" stroke-width="11" fill="none" stroke-linejoin="miter" stroke-miterlimit="10"`;
 let b;
 if(ch==='Λ') b=`<path d="M8,94 L50,8 L92,94" ${st}/>`;
 else if(ch==='Ξ') b=`<rect x="12" y="8" width="76" height="13" fill="${gold}"/><rect x="12" y="44.5" width="76" height="13" fill="${gold}"/><rect x="12" y="81" width="76" height="13" fill="${gold}"/>`;
 else b=`<text x="50" y="94" text-anchor="middle" font-family="Montserrat" font-weight="400" font-size="122" fill="${col}">${ch}</text>`;
 return `<svg class="lt" viewBox="0 0 100 100" style="overflow:visible">${b}</svg>`;}
function wordmark(letters,col,h,gap){return `<div class="wm" style="display:flex;gap:${gap}px;height:${h}px">${letters.map(c=>`<div style="height:${h}px;width:${h}px">${letter(c,col,'#C9963A')}</div>`).join('')}</div>`}
function animLogo(root,t){
 const g=s=>root.querySelector(s);
 A(g('.lg-apex'),[{clipPath:'inset(100% 0 0 0)'},{clipPath:'inset(0% 0 0 0)'}],t,.9,{e:E.inout});
 A(g('.lg-red'),[{clipPath:'inset(0 0 100% 0)'},{clipPath:'inset(0 0 0% 0)'}],t+.45,.8,{e:E.inout});
 A(g('.lg-sw'),[{clipPath:'inset(0 100% 0 0)'},{clipPath:'inset(0 0% 0 0)'}],t+.75,1.0,{e:E.inout});
 A(g('.lg-star'),[{opacity:0,transform:'scale(0) rotate(-90deg)',transformOrigin:'89% 10%'},{opacity:1,transform:'scale(1) rotate(0)',transformOrigin:'89% 10%'}],t+1.55,.8,{e:E.back});
 A(g('.lg-star'),[{filter:'drop-shadow(0 0 0px #F4D58A)'},{filter:'drop-shadow(0 0 14px #F4D58A)'}],t+2.2,1.2,{e:E.inout,it:20,dir:'alternate',fill:'forwards'});
}
const miniLogo=dark=>`<div class="mini" style="color:${dark?'#fff':'#05254E'}"><div style="position:relative;width:46px;height:40px">${logoIcon(dark?'#fff':'#05254E')}</div><div class="w">ANEORAS</div></div>`;

/* decorative swoosh for navy scenes */
const deco=()=>`<svg class="deco abs" style="left:0;top:0" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><linearGradient id="dg${UID}" x1="0" x2="1"><stop offset="0" stop-color="#D6A13B" stop-opacity="0"/><stop offset="1" stop-color="#F4D58A" stop-opacity=".35"/></linearGradient></defs><path d="M-100,1180 C500,820 1100,520 2050,160" stroke="url(#dg${UID++})" stroke-width="2.5" fill="none"/><path d="M-100,1260 C560,900 1200,640 2050,330" stroke="rgba(214,161,59,.10)" stroke-width="1.5" fill="none"/></svg>`;

/* ---------- scene factory ---------- */
function scene(start,end,cls,html,opt={}){const s=document.createElement('div');s.className='scene '+cls;s.innerHTML=(cls==='navy'&&!opt.nodeco?deco():'')+html;stage.appendChild(s);
 A(s,[{opacity:0,transform:'scale(1.035)'},{opacity:1,transform:'scale(1)'}],start,.75,{e:E.out});
 if(end) A(s,[{visibility:'visible'},{visibility:'hidden'}],end,.01,{fill:'forwards',e:E.lin});
 const d=s.querySelector('.deco'); if(d) A(d,[{transform:'translateX(-60px)'},{transform:'translateX(60px)'}],start,(end||start+10)-start,{e:E.lin});
 s.q=sel=>s.querySelector(sel); s.qa=sel=>[...s.querySelectorAll(sel)];
 return s;}

/* ---------- reusable scenes ---------- */
function chapter(t0,t1,num,word,sub){
 const s=scene(t0,t1,'navy',`
 <div class="abs num goldtxt" style="left:150px;top:250px;font-size:400px;font-weight:700;line-height:1;letter-spacing:-.04em">${num}</div>
 <div class="abs" style="left:700px;top:370px">
   <div class="tag">Étape ${num}</div>
   <div class="wd" style="font-size:128px;font-weight:700;letter-spacing:.1em;margin-top:18px;line-height:1.05">${[...word].map(c=>`<span class="mask"><span>${c}</span></span>`).join('')}</div>
   <div class="sb" style="font-size:40px;font-weight:400;color:#c9d3e6;margin-top:28px;max-width:1050px;line-height:1.35">${sub}</div>
 </div>
 <svg class="abs" style="left:0;top:0" width="1920" height="1080"><path class="sw" d="M150,900 C620,860 1180,820 1760,690" stroke="#D6A13B" stroke-width="5" fill="none" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></svg>
 <svg class="abs st" style="left:1736px;top:662px" width="52" height="52" viewBox="0 0 52 52"><path fill="#F4D58A" d="M26,0 L30.5,21.5 L52,26 L30.5,30.5 L26,52 L21.5,30.5 L0,26 L21.5,21.5Z"/></svg>
 ${miniLogo(true)}`);
 A(s.q('.num'),[{clipPath:'inset(100% 0 0 0)',transform:'translateY(60px)'},{clipPath:'inset(0% 0 0 0)',transform:'none'}],t0+.2,1.1,{e:E.out});
 fadeIn(s.q('.tag'),t0+.6);
 $$(s,'.wd .mask>span').forEach((e,i)=>A(e,[{transform:'translateY(110%)'},{transform:'none'}],t0+.7+i*.05,.8));
 fadeUp(s.q('.sb'),t0+1.5,.9,30);
 A(s.q('.sw'),[{strokeDashoffset:1},{strokeDashoffset:0}],t0+.4,1.8,{e:E.inout});
 pop(s.q('.st'),t0+2.0,.8);
 A(s.q('.st'),[{transform:'rotate(0deg)'},{transform:'rotate(90deg)'}],t0+2.8,3,{e:E.inout,fill:'forwards'});
 return s;}
