        --navy-deep: #031a38;
        --navy-mid: #0b3366;
        --red: #b71932;
        --red-deep: #8e1628;
        --gold: #d6a13b;
        --gold-light: #f4d58a;
        --gold-dark: #b88626;
        --white: #ffffff;
        --grey-light: #e8e8e8;
        --grey-dark: #2b2b2b;
        --font: "Montserrat", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--white); font-family: var(--font); }
      #main-bg { position: absolute; inset: 0; background: var(--white); }
