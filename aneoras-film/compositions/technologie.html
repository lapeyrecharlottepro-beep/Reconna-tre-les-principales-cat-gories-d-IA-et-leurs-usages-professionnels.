  <script>
    (function () {
      function split(scope) {
        scope.querySelectorAll(".split").forEach((el) => {
          const out = [];
          Array.from(el.childNodes).forEach((n) => {
            if (n.nodeType === 3) {
              n.textContent.split(/(\s+)/).forEach((p) => {
                if (!p) return;
                if (/^\s+$/.test(p)) out.push(document.createTextNode(" "));
                else { const s = document.createElement("span"); s.className = "w"; s.textContent = p; out.push(s); }
              });
            } else { n.classList.add("w"); out.push(n); }
          });
          el.replaceChildren(...out);
        });
      }
      split(document.querySelector('[data-composition-id="technologie"]'));

      // perspective floor: gold lines converging on the horizon's vanishing point
      let g = "";
      for (let k = -8; k <= 8; k++) g += `<line x1="960" y1="540" x2="${960 + k * 300}" y2="1080" stroke="#D6A13B" stroke-width="${k === 0 ? 4 : 3}"/>`;
      [560, 600, 660, 760, 920].forEach((y) => (g += `<line x1="0" y1="${y}" x2="1920" y2="${y}" stroke="#E8E8E8" stroke-width="3"/>`));
      document.getElementById("s9-grid").innerHTML = g;

      const tl = gsap.timeline({ paused: true });
      const wIn = (sel, at, st = 0.07) => tl.fromTo(sel, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power4.out", stagger: st }, at);
      const wOut = (sel, at) => tl.to(sel, { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power2.in", stagger: 0.01 }, at);

      tl.fromTo("#s9-persp", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
      // the star becomes the light; a person, and the potential they project
      tl.fromTo("#s9-star", { x: 0, y: 0, scale: 1 }, { x: 400, y: 20, scale: 0.8, duration: 0.8, ease: "power2.inOut" }, 0.1);
      tl.fromTo("#s9-ground", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "expo.out" }, 0.2);
      tl.fromTo("#s9-person", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "expo.out" }, 0.3);
      tl.fromTo("#s9-shadow", { opacity: 0, scale: 1, transformOrigin: "75px 280px" }, { opacity: 1, duration: 0.3 }, 0.6);
      wIn("#s9-t1 .a .w", 0.4);
      wIn("#s9-t1 .b .w", 1.2, 0.12);
      tl.to("#s9-shadow", { scale: 2.6, duration: 1.6, ease: "power2.inOut" }, 1.1);
      wOut("#s9-t1 .w", 3.2);

      // AI that assists: the star comes to the person's side
      wIn("#s9-p1 .w", 3.6, 0.06);
      tl.to("#s9-star", { x: 160, y: 270, scale: 0.55, duration: 0.8, ease: "power2.inOut" }, 3.7);
      // expertise that guides: the star leads the way
      wIn("#s9-p2 .w", 5.0);
      tl.fromTo("#s9-gp", { strokeDashoffset: 110 }, { strokeDashoffset: 0, duration: 1.0, ease: "power2.inOut" }, 5.1);
      tl.to("#s9-star", { x: 680, y: 300, duration: 1.0, ease: "power2.inOut" }, 5.2);
      // innovation that opens
      wIn("#s9-p3 .w", 6.4);
      wOut(["#s9-p1 .w", "#s9-p2 .w", "#s9-p3 .w"], 7.55);
      tl.to("#s9-star", { x: 0, y: 240, scale: 0.7, duration: 0.6, ease: "power2.inOut" }, 7.5);
      // doors close on the old frame…
      tl.fromTo("#s9-dl", { x: -980 }, { x: 0, duration: 0.55, ease: "power3.inOut" }, 7.9);
      tl.fromTo("#s9-dr", { x: 980 }, { x: 0, duration: 0.55, ease: "power3.inOut" }, 7.9);
      tl.set("#s9-stage", { opacity: 0 }, 8.5);
      tl.set("#s9-persp", { opacity: 1 }, 8.5);
      // … and open onto a new perspective
      tl.to("#s9-dl", { x: -980, duration: 0.9, ease: "power3.inOut" }, 8.9);
      tl.to("#s9-dr", { x: 980, duration: 0.9, ease: "power3.inOut" }, 8.9);
      tl.to("#s9-star", { opacity: 0, scale: 0.2, duration: 0.4, ease: "power2.in" }, 9.0);
      wIn("#s9-pt .w", 9.45, 0.12);
      wOut("#s9-pt .w", 10.65);
      // travel to the horizon
      tl.fromTo("#s9-persp", { scale: 1, transformOrigin: "960px 500px" }, { scale: 7, duration: 0.7, ease: "power3.in" }, 10.8);
      window.__timelines["technologie"] = tl;
    })();
