  <script>
    (function () {
      function split(scope) {
        scope.querySelectorAll(".split").forEach((el) => {
          const out = [];
          Array.from(el.childNodes).forEach((n) => {
            if (n.nodeType === 3) {
              n.textContent.split(/(\s+)/).forEach((p) => {
                if (!p) return;
                if (/^\s+$/.test(p)) out.push(document.createTextNode(" "));
                else { const s = document.createElement("span"); s.className = "w"; s.textContent = p; out.push(s); }
              });
            } else { n.classList.add("w"); out.push(n); }
          });
          el.replaceChildren(...out);
        });
      }
      split(document.getElementById("s7-all"));

      const tl = gsap.timeline({ paused: true });
      const wIn = (sel, at, st = 0.08) => tl.fromTo(sel, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power4.out", stagger: st }, at);
      const wOut = (sel, at) => tl.to(sel, { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power2.in", stagger: 0.01 }, at);

      // iris opens from the star at the top of the staircase
      tl.fromTo("#s7-all", { clipPath: "circle(0px at 1720px 240px)" }, { clipPath: "circle(2300px at 1720px 240px)", duration: 0.6, ease: "power2.inOut" }, 0);
      wIn("#s7-kick .w", 0.5);
      wIn("#s7-title .w", 0.65, 0.1);
      tl.fromTo("#s7-rule", { scaleX: 0, transformOrigin: "0 50%" }, { scaleX: 1, duration: 0.5, ease: "expo.out" }, 0.9);

      // scattered processes fall into one flow
      const mess = [[80, 180, -14], [20, -70, 9], [-40, 190, -6], [60, -40, 16], [-90, 150, -10]];
      mess.forEach((m, i) => {
        tl.fromTo(`#s7-c${i}`, { x: m[0], y: m[1], rotation: m[2], opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.45, ease: "expo.out" }, 0.75 + i * 0.08);
        tl.to(`#s7-c${i}`, { x: 0, y: 0, rotation: 0, duration: 1.0, ease: "power3.inOut" }, 1.8 + i * 0.03);
      });
      tl.fromTo(".s7-con", { scaleX: 0, transformOrigin: "0 50%" }, { scaleX: 1, duration: 0.4, ease: "power2.out", stagger: 0.08 }, 2.75);
      wIn("#s7-la .a .w", 1.9);
      wIn("#s7-la .b .w", 2.4);
      // … and go digital
      tl.fromTo(".s7-ui", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out", stagger: 0.1 }, 3.4);
      tl.fromTo(".s7-track", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
      tl.fromTo(".s7-fill", { scaleX: 0, transformOrigin: "0 50%" }, { scaleX: 0, duration: 0.01 }, 0);
      wOut("#s7-la .w", 4.7);

      // know-how travels along the flow
      wIn("#s7-lb .w", 5.0);
      tl.fromTo("#s7-token", { x: 0, scale: 0 }, { scale: 1, duration: 0.35, ease: "expo.out" }, 5.0);
      tl.to("#s7-token", { x: 1320, duration: 1.8, ease: "power1.inOut" }, 5.2);
      tl.to("#s7-token", { scale: 0, duration: 0.25, ease: "power2.in" }, 7.0);
      wOut("#s7-lb .w", 6.9);

      // skills grow in every tool
      wIn("#s7-lc .w", 7.1);
      tl.to(".s7-track", { opacity: 1, duration: 0.2, stagger: 0.12 }, 7.15);
      tl.to(".s7-fill", { scaleX: 1, duration: 0.7, ease: "power2.inOut", stagger: 0.12 }, 7.25);

      // the last card becomes the next world
      wOut("#s7-lc .w", 8.95);
      tl.to(["#s7-kick", "#s7-title", "#s7-rule", ".s7-con", "#s7-c0", "#s7-c1", "#s7-c2", "#s7-c3"], { opacity: 0, filter: "blur(12px)", duration: 0.3, ease: "power2.in" }, 9.0);
      tl.to("#s7-c4 .s7-ui, #s7-c4 .s7-track, #s7-c4 .bar", { opacity: 0, duration: 0.2 }, 9.0);
      tl.to("#s7-c4", { scale: 20, duration: 0.65, ease: "power2.in" }, 9.2);
      window.__timelines["entreprises"] = tl;
    })();
  </script>
