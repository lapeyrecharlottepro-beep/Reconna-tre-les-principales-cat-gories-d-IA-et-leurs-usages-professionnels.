<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: var(--white); font-family: var(--font); }
    #s4-all { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
    #s4-line { position: absolute; left: 0; top: 538px; width: 1920px; height: 4px; background: linear-gradient(90deg, #b88626 0%, #f4d58a 50%, #d6a13b 100%); }
    #s4-title { position: absolute; left: 190px; top: 160px; font-weight: 700; font-size: 76px; color: var(--navy); letter-spacing: -0.01em; }
    .s4-label { position: absolute; left: 190px; top: 430px; width: 640px; color: var(--navy); }
    .s4-label .a { font-weight: 700; font-size: 56px; line-height: 1.15; }
    .s4-label .b { font-weight: 500; font-size: 38px; line-height: 1.3; margin-top: 10px; color: var(--grey-dark); }
    .acc-red { color: var(--red); }
    .w { display: inline-block; }
    .s4-dot { position: absolute; width: 18px; height: 18px; border-radius: 50%; background: var(--navy); }
    #s4-ring { position: absolute; left: 1040px; top: 330px; width: 420px; height: 420px; border-radius: 50%; border: 4px solid var(--gold); }
    #s4-paths { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
    .s4-block { position: absolute; width: 160px; height: 90px; background: var(--navy); }
    .s4-block i { position: absolute; left: 0; top: 0; width: 160px; height: 14px; background: var(--navy-mid); }
    #s4-b6 { background: var(--red); }
    #s4-b6 i { background: #d24a5a; }
    #s4-base { position: absolute; left: 960px; top: 770px; width: 600px; height: 4px; background: var(--grey-light); }
    #s4-star { position: absolute; left: 1230px; top: 400px; width: 60px; height: 60px; }
    #s4-star svg { width: 100%; height: 100%; display: block; }
  </style>
  <div id="root" data-composition-id="cotes" data-width="1920" data-height="1080">
    <div id="s4-all">
      <div id="s4-title" class="split">À vos côtés,</div>

      <div id="s4-la" class="s4-label"><div class="a split">Comprendre</div><div class="b split">vos enjeux</div></div>
      <div id="s4-lb" class="s4-label"><div class="a split">Accompagner</div><div class="b split">vos réflexions</div></div>
      <div id="s4-lc" class="s4-label"><div class="a split">Construire <span class="acc-red">avec vous</span></div><div class="b split">les réponses aux défis d’aujourd’hui et de demain</div></div>

      <div id="s4-dots"></div>
      <div id="s4-ring"></div>

      <svg id="s4-paths" viewBox="0 0 1920 1080">
        <path id="s4-p1" d="M880 600 C1050 600 1100 470 1250 470 S1450 560 1660 520" pathLength="100" fill="none" stroke="#05254E" stroke-width="8" stroke-linecap="round" stroke-dasharray="100 120" stroke-dashoffset="110"/>
        <path id="s4-p2" d="M880 660 C1050 660 1100 530 1250 530 S1450 620 1660 580" pathLength="100" fill="none" stroke="#D6A13B" stroke-width="8" stroke-linecap="round" stroke-dasharray="100 120" stroke-dashoffset="110"/>
      </svg>

      <div id="s4-base"></div>
      <div id="s4-b1" class="s4-block" style="left:1010px;top:680px"><i></i></div>
      <div id="s4-b2" class="s4-block" style="left:1180px;top:680px"><i></i></div>
      <div id="s4-b3" class="s4-block" style="left:1350px;top:680px"><i></i></div>
      <div id="s4-b4" class="s4-block" style="left:1095px;top:580px"><i></i></div>
      <div id="s4-b5" class="s4-block" style="left:1265px;top:580px"><i></i></div>
      <div id="s4-b6" class="s4-block" style="left:1180px;top:480px"><i></i></div>
      <div id="s4-star"><svg viewBox="0 0 100 100"><defs><linearGradient id="s4-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#B88626"/><stop offset=".5" stop-color="#F4D58A"/><stop offset="1" stop-color="#D6A13B"/></linearGradient></defs><path d="M50 0 C53 38 62 47 100 50 C62 53 53 62 50 100 C47 62 38 53 0 50 C38 47 47 38 50 0 Z" fill="url(#s4-g)"/></svg></div>
      <div id="s4-line"></div>
    </div>
  </div>
  <script>
    (function () {
      function split(scope) {
        scope.querySelectorAll(".split").forEach((el) => {
          const out = [];
          Array.from(el.childNodes).forEach((n) => {
            if (n.nodeType === 3) {
              n.textContent.split(/(\s+)/).forEach((p) => {
                if (!p) return;
                if (/^\s+$/.test(p)) out.push(document.createTextNode(" "));
                else { const s = document.createElement("span"); s.className = "w"; s.textContent = p; out.push(s); }
              });
            } else { n.classList.add("w"); out.push(n); }
          });
          el.replaceChildren(...out);
        });
      }
      split(document.getElementById("s4-all"));

      // 20 scattered dots (seeded, deterministic) and their grid targets inside the ring
      let seed = 7;
      const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
      const dots = document.getElementById("s4-dots");
      const targets = [];
      let html = "";
      for (let k = 0; k < 20; k++) {
        const x = 900 + rnd() * 700, y = 270 + rnd() * 540;
        const c = k % 5, r = Math.floor(k / 5);
        targets.push({ x: 1250 + (c - 2) * 56 - 9 - x, y: 540 + (r - 1.5) * 56 - 9 - y });
        html += `<div class="s4-dot" id="s4-d${k}" style="left:${x.toFixed(1)}px;top:${y.toFixed(1)}px"></div>`;
      }
      dots.innerHTML = html;

      const tl = gsap.timeline({ paused: true });
      const wIn = (sel, at, st = 0.07) => tl.fromTo(sel, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power4.out", stagger: st }, at);
      const wOut = (sel, at) => tl.to(sel, { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power2.in", stagger: 0.01 }, at);

      // the horizon line becomes the title's rule
      tl.fromTo("#s4-line", { x: 0, y: 0, scaleX: 1, transformOrigin: "0px 2px" }, { x: 190, y: -270, scaleX: 100 / 1920, duration: 0.7, ease: "power3.inOut" }, 0.1);
      wIn("#s4-title .w", 0.45, 0.1);

      // A — understand: scattered issues come into focus
      wIn("#s4-la .w", 1.0);
      tl.fromTo(".s4-dot", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "expo.out", stagger: 0.02 }, 0.9);
      tl.fromTo("#s4-ring", { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: "expo.out" }, 1.5);
      targets.forEach((t, k) => tl.to(`#s4-d${k}`, { x: t.x, y: t.y, duration: 0.9, ease: "power3.inOut" }, 2.1 + k * 0.015));
      wOut("#s4-la .w", 3.7);
      tl.to(["#s4-ring", ".s4-dot"], { opacity: 0, filter: "blur(10px)", duration: 0.3, ease: "power2.in" }, 3.8);

      // B — accompany: two paths walking side by side
      wIn("#s4-lb .w", 4.1);
      tl.fromTo("#s4-p1", { strokeDashoffset: 110 }, { strokeDashoffset: 0, duration: 1.8, ease: "power2.inOut" }, 4.2);
      tl.fromTo("#s4-p2", { strokeDashoffset: 110 }, { strokeDashoffset: 0, duration: 1.8, ease: "power2.inOut" }, 4.35);
      wOut("#s4-lb .w", 6.9);
      tl.to("#s4-paths", { opacity: 0, filter: "blur(10px)", duration: 0.3, ease: "power2.in" }, 7.0);

      // C — build together: blocks rise into a structure, the star crowns it
      wIn("#s4-lc .a .w", 7.3);
      wIn("#s4-lc .b .w", 8.1, 0.05);
      tl.fromTo("#s4-base", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "expo.out" }, 7.35);
      ["#s4-b1", "#s4-b2", "#s4-b3", "#s4-b4", "#s4-b5", "#s4-b6"].forEach((b, i) =>
        tl.fromTo(b, { y: -90, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 7.5 + i * 0.2));
      tl.fromTo("#s4-star", { scale: 0, rotation: -90 }, { scale: 1, rotation: 0, duration: 0.7, ease: "expo.out" }, 8.9);

      // whip to the next world
      tl.to("#s4-all", { x: -760, filter: "blur(18px)", opacity: 0, duration: 0.4, ease: "power3.in" }, 10.55);
      window.__timelines["cotes"] = tl;
    })();
  </script>
</template>
